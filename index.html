<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hakhagi</title>
  <meta name="description" content="Aplikasi muslim harian — jadwal sholat, Qur'an, hadits, dzikir" />
  <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://unpkg.com/alpinejs@3.14.8" defer></script>
  <script src="https://unpkg.com/@alpinejs/persist@3.14.8" defer></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="/styles/app.css" />
  <style>
    .sholat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .sholat-item { text-align: center; padding: 14px 8px; border-radius: 8px; background: var(--surface-hover); border: 1px solid var(--border); }
    .sholat-item .time { font-size: calc(1.5rem * var(--fs)); font-weight: 600; color: var(--text); direction: ltr; }
    .sholat-item .label { font-size: calc(0.7rem * var(--fs)); color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sholat-today { text-align: center; padding: 20px; margin-bottom: 16px; background: var(--primary-soft); border-radius: 12px; border: 1px solid var(--border); }
    .sholat-today .date { font-size: calc(0.8rem * var(--fs)); color: var(--text-muted); }
    .sholat-today .city { font-size: calc(0.7rem * var(--fs)); color: var(--text-subtle); margin-top: 2px; }
    .surah-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .surah-item:hover { background: var(--surface-hover); }
    .surah-num { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); border-radius: 50%; font-size: 0.75rem; font-weight: 600; color: var(--primary); flex-shrink: 0; }
    .surah-name { font-weight: 600; font-size: calc(0.9rem * var(--fs)); }
    .surah-meta { font-size: calc(0.7rem * var(--fs)); color: var(--text-muted); }
    .surah-arti { font-size: calc(0.75rem * var(--fs)); color: var(--text-subtle); }
    .ayat-card { padding: 20px 16px; border-bottom: 1px solid var(--border); }
    .ayat-card:last-child { border-bottom: none; }
    .ayat-arab { font-family: 'Noto Naskh Arabic', 'Amiri', serif; font-size: calc(1.4rem * var(--fs)); line-height: 2.2; text-align: right; direction: rtl; margin-bottom: 8px; }
    .ayat-terj { font-size: calc(0.85rem * var(--fs)); color: var(--text-muted); line-height: 1.7; }
    .ayat-num { font-size: calc(0.65rem * var(--fs)); color: var(--text-subtle); font-family: monospace; margin-bottom: 4px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; font-size: 0.8rem; font-weight: 500; margin-bottom: 12px; }
    .back-btn:hover { background: var(--surface-hover); }
    .hadits-book { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .hadits-book:hover { background: var(--surface-hover); }
    .hadits-book .name { font-weight: 600; font-size: calc(0.9rem * var(--fs)); }
    .hadits-book .count { font-size: 0.75rem; color: var(--text-subtle); }
    .hadits-card { padding: 16px; border-bottom: 1px solid var(--border); }
    .hadits-card:last-child { border-bottom: none; }
    .hadits-arab { font-family: 'Noto Naskh Arabic', 'Amiri', serif; font-size: calc(1.1rem * var(--fs)); line-height: 2; text-align: right; direction: rtl; margin-bottom: 8px; }
    .hadits-terj { font-size: calc(0.85rem * var(--fs)); color: var(--text-muted); line-height: 1.7; }
    .hadits-meta { font-size: calc(0.65rem * var(--fs)); color: var(--text-subtle); margin-top: 6px; display: flex; gap: 8px; }
    .dzikir-group { margin-bottom: 24px; }
    .dzikir-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
    .dzikir-arab { font-family: 'Noto Naskh Arabic', 'Amiri', serif; font-size: calc(1.1rem * var(--fs)); line-height: 2; text-align: right; direction: rtl; margin-bottom: 6px; }
    .dzikir-terj { font-size: calc(0.8rem * var(--fs)); color: var(--text-muted); margin-bottom: 8px; }
    .dzikir-counter { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 8px; }
    .counter-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 600; }
    .counter-btn:hover { background: var(--primary-soft); }
    .counter-num { font-size: 1.2rem; font-weight: 600; color: var(--text); min-width: 24px; text-align: center; font-family: monospace; }
    .counter-target { font-size: 0.7rem; color: var(--text-subtle); }
    .dzikir-ref { font-size: 0.65rem; color: var(--accent); margin-top: 4px; }
    .search-res { max-height: 400px; overflow-y: auto; }
    .loading-spinner { display: flex; align-items: center; justify-content: center; padding: 40px; }
    .error-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }
    @media (max-width: 400px) {
      .sholat-grid { gap: 6px; }
      .sholat-item { padding: 10px 4px; }
      .sholat-item .time { font-size: calc(1.2rem * var(--fs)); }
    }
  </style>
</head>
<body x-data="hakhagiApp()" x-init="init()" :class="{ 'dark': darkMode, 'theme-warp': theme==='warp' }" :data-font-size="fontSize">
  <main id="content">
    <template x-if="activeTab === 'sholat'">
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Jadwal Sholat</h2>
          <span class="badge">Solo</span>
        </div>
        <template x-if="sholatLoading"><div class="loading-spinner"><div class="spinner"></div></div></template>
        <template x-if="!sholatLoading && sholatError">
          <div class="error-msg">
            <p>Gagal memuat jadwal sholat</p>
            <p class="text-xs mt-2 opacity-60" x-text="sholatError"></p>
          </div>
        </template>
        <template x-if="!sholatLoading && sholatToday">
          <div class="sholat-today">
            <div class="date" x-text="sholatToday.tanggal"></div>
            <div class="city">KOTA SURAKARTA</div>
          </div>
          <div class="sholat-grid">
            <div class="sholat-item"><div class="time" x-text="sholatToday.imsak"></div><div class="label">Imsak</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.subuh"></div><div class="label">Subuh</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.terbit"></div><div class="label">Terbit</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.dhuha"></div><div class="label">Dhuha</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.dzuhur"></div><div class="label">Dzuhur</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.ashar"></div><div class="label">Ashar</div></div>
            <div class="sholat-item" style="border-color:var(--primary);background:var(--primary-soft)"><div class="time" style="color:var(--primary)" x-text="sholatToday.maghrib"></div><div class="label">Maghrib</div></div>
            <div class="sholat-item"><div class="time" x-text="sholatToday.isya"></div><div class="label">Isya</div></div>
          </div>
        </template>
        <template x-if="!sholatLoading && sholatMonth.length > 0">
          <div class="mt-4">
            <h3 class="text-sm font-semibold mb-3 opacity-60">Kalender Bulanan</h3>
            <table style="width:100%;font-size:calc(0.7rem * var(--fs));border-collapse:collapse">
              <thead><tr style="color:var(--text-subtle);border-bottom:1px solid var(--border)">
                <th style="padding:6px 4px;text-align:left">Tgl</th>
                <th style="padding:6px 4px">Imsak</th><th style="padding:6px 4px">Subuh</th><th style="padding:6px 4px">Dzuhur</th><th style="padding:6px 4px">Ashar</th><th style="padding:6px 4px">Maghrib</th><th style="padding:6px 4px">Isya</th>
              </tr></thead>
              <tbody>
                <template x-for="d in sholatMonth" :key="d.date">
                  <tr style="border-bottom:1px solid var(--border);" :style="d.date === sholatToday?.date ? 'background:var(--primary-soft);font-weight:600' : ''">
                    <td style="padding:5px 4px" x-text="d.tanggal.split(', ')[1]?.slice(0,5) || d.date.slice(8,10)"></td>
                    <td style="padding:5px 4px;text-align:center" x-text="d.imsak"></td>
                    <td style="padding:5px 4px;text-align:center" x-text="d.subuh"></td>
                    <td style="padding:5px 4px;text-align:center" x-text="d.dzuhur"></td>
                    <td style="padding:5px 4px;text-align:center" x-text="d.ashar"></td>
                    <td style="padding:5px 4px;text-align:center;color:var(--primary);font-weight:500" x-text="d.maghrib"></td>
                    <td style="padding:5px 4px;text-align:center" x-text="d.isya"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>

    <template x-if="activeTab === 'quran'">
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Al-Qur'an</h2>
          <input class="search-input" style="max-width:180px;padding:8px 12px;font-size:0.75rem" placeholder="Cari surah..." x-model="quranSearch" @input="filterSurah()" />
        </div>
        <template x-if="quranLoading"><div class="loading-spinner"><div class="spinner"></div></div></template>
        <template x-if="!quranLoading && quranError">
          <div class="error-msg">Gagal memuat daftar surah</div>
        </template>
        <template x-if="!quranLoading && !quranSurah">
          <div class="flex items-center justify-between mb-3">
            <button class="back-btn" @click="quranSurah=null;quranAyat=[]" x-show="quranAyat.length > 0">← Kembali</button>
          </div>
        </template>
        <template x-if="activeSurah">
          <div>
            <button class="back-btn" @click="activeSurah=null;quranAyat=[]">← Kembali ke daftar</button>
            <div class="card mb-4">
              <div class="text-center mb-3">
                <div class="text-2xl font-arabic mb-2" x-html="activeSurah.nama"></div>
                <div class="text-lg font-semibold" x-text="activeSurah.nama_latin"></div>
                <div class="text-sm opacity-60" x-text="activeSurah.arti + ' — ' + activeSurah.jumlah_ayat + ' ayat, ' + activeSurah.tempat_turun"></div>
              </div>
              <template x-for="(ayat, i) in quranAyat" :key="ayat.nomor">
                <div class="ayat-card">
                  <div class="ayat-num" x-text="ayat.nomor"></div>
                  <div class="ayat-arab" x-html="ayat.ar"></div>
                  <div class="ayat-terj" x-text="ayat.idn"></div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <template x-if="!quranLoading && !activeSurah && quranFiltered.length > 0">
          <div class="card">
            <template x-for="s in quranFiltered" :key="s.nomor">
              <div class="surah-item" @click="openSurah(s)">
                <div class="surah-num" x-text="s.nomor"></div>
                <div style="flex:1">
                  <div class="surah-name" x-text="s.nama_latin"></div>
                  <div class="surah-arti" x-text="s.arti"></div>
                </div>
                <div class="surah-meta" x-text="s.jumlah_ayat + ' ayat'"></div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="!quranLoading && !activeSurah && quranFiltered.length === 0 && !quranSurah">
          <div class="error-msg">Pencarian tidak ditemukan</div>
        </template>
      </div>
    </template>

    <template x-if="activeTab === 'hadits'">
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold">Hadits</h2>
          <input class="search-input" style="max-width:180px;padding:8px 12px;font-size:0.75rem" placeholder="Cari..." x-model="haditsSearch" @input="filterHadits()" />
        </div>
        <template x-if="!haditsLoading && activeBook">
          <div>
            <button class="back-btn" @click="activeBook=null;haditsItems=[]">← Kembali</button>
            <div class="card mt-3">
              <h3 class="text-base font-semibold mb-2" x-text="activeBook.perawi_nama"></h3>
              <template x-for="h in filteredHadits" :key="h.id">
                <div class="hadits-card">
                  <div class="hadits-arab" x-text="h.teks_arab"></div>
                  <div class="hadits-terj" x-text="h.terjemahan_id"></div>
                  <div class="hadits-meta"><span x-text="'No. ' + h.nomor"></span><span x-text="h.derajat"></span></div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <template x-if="!haditsLoading && !activeBook">
          <div class="card">
            <template x-for="b in filteredBooks" :key="b.perawi_slug">
              <div class="hadits-book" @click="openBook(b)">
                <div class="name" x-text="b.perawi_nama"></div>
                <div class="count" x-text="b.total + ' hadits'"></div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="haditsLoading"><div class="loading-spinner"><div class="spinner"></div></div></template>
      </div>
    </template>

    <template x-if="activeTab === 'dzikir'">
      <div>
        <h2 class="text-xl font-semibold mb-4">Dzikir & Doa</h2>
        <div class="flex gap-1 mb-4" style="border-bottom:1px solid var(--border)">
          <template x-for="(g, i) in dzikirGroups" :key="g.id">
            <button class="tab-btn" :class="{ 'active': dzikirActive === i }" @click="dzikirActive = i; resetDzikirCounters(i)" x-text="g.title"></button>
          </template>
        </div>
        <template x-if="dzikirGroups[dzikirActive]">
          <div>
            <template x-for="(item, idx) in dzikirGroups[dzikirActive].items" :key="idx">
              <div class="dzikir-card">
                <div class="dzikir-arab" x-text="item.arabic"></div>
                <div class="dzikir-terj"><em x-text="item.latin"></em> — <span x-text="item.translation"></span></div>
                <div class="dzikir-counter">
                  <button class="counter-btn" @click="decrementDzikir(idx)" :disabled="dzikirCounters[idx] <= 0">−</button>
                  <span class="counter-num" x-text="dzikirCounters[idx]"></span>
                  <span class="counter-target">/ <span x-text="item.count"></span></span>
                  <button class="counter-btn" @click="incrementDzikir(idx)" :disabled="dzikirCounters[idx] >= item.count">+</button>
                </div>
                <template x-if="item.reference">
                  <div class="dzikir-ref" x-text="item.reference"></div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="activeTab === 'settings'">
      <div>
        <h2 class="text-xl font-semibold mb-4">Pengaturan</h2>
        <div class="card space-y-4">
          <div class="flex items-center justify-between">
            <div><div class="text-sm font-medium">Mode Gelap</div><div class="text-xs opacity-60">Tampilan gelap untuk kenyamanan mata</div></div>
            <button @click="darkMode = !darkMode" style="width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background 0.2s" :style="darkMode ? 'background:var(--primary)' : 'background:var(--border)'">
              <span style="width:18px;height:18px;border-radius:50%;background:white;position:absolute;top:3px;transition:left 0.2s" :style="darkMode ? 'left:22px' : 'left:3px'"></span>
            </button>
          </div>
          <div class="border-t" style="padding-top:16px">
            <div class="text-sm font-medium mb-2">Ukuran Teks</div>
            <div class="flex gap-2">
              <button class="font-size-btn" :class="{ 'active': fontSize === 'small' }" @click="fontSize='small'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:0.7rem">Kecil</button>
              <button class="font-size-btn" :class="{ 'active': fontSize === 'medium' }" @click="fontSize='medium'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:0.85rem">Sedang</button>
              <button class="font-size-btn" :class="{ 'active': fontSize === 'large' }" @click="fontSize='large'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:1rem">Besar</button>
            </div>
          </div>
          <div class="border-t" style="padding-top:16px">
            <div class="text-sm font-medium mb-2">Tema</div>
            <div class="flex gap-2">
              <button class="theme-btn" :class="{ 'active': theme === 'default' }" @click="theme='default'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:0.8rem">Default</button>
              <button class="theme-btn" :class="{ 'active': theme === 'warp' }" @click="theme='warp'" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:0.8rem">Warp</button>
            </div>
          </div>
          <div class="border-t" style="padding-top:16px">
            <div class="text-xs opacity-60 text-center">Hakhagi v0.2.0 — Static</div>
          </div>
        </div>
      </div>
    </template>
  </main>

  <nav>
    <button @click="activeTab='sholat'" :class="activeTab==='sholat' ? 'active' : ''"><i data-lucide="clock"></i><span>Sholat</span></button>
    <button @click="activeTab='quran'" :class="activeTab==='quran' ? 'active' : ''"><i data-lucide="book-open"></i><span>Qur'an</span></button>
    <button @click="activeTab='hadits'" :class="activeTab==='hadits' ? 'active' : ''"><i data-lucide="scroll-text"></i><span>Hadits</span></button>
    <button @click="activeTab='dzikir'" :class="activeTab==='dzikir' ? 'active' : ''"><i data-lucide="heart"></i><span>Dzikir</span></button>
    <button @click="activeTab='settings'" :class="activeTab==='settings' ? 'active' : ''"><i data-lucide="settings"></i><span>Atur</span></button>
  </nav>

  <script>
    document.addEventListener('alpine:init', () => {
      if (window.lucide) lucide.createIcons()
    })

    function hakhagiApp() {
      return {
        activeTab: localStorage.getItem('hakhagi-tab') || 'sholat',
        darkMode: localStorage.getItem('hakhagi-dark') === 'true' ||
          (localStorage.getItem('hakhagi-dark') === null && window.matchMedia('(prefers-color-scheme: dark)').matches),
        fontSize: localStorage.getItem('hakhagi-font') || 'medium',
        theme: localStorage.getItem('hakhagi-theme') || 'default',

        // Sholat
        sholatLoading: true,
        sholatError: null,
        sholatToday: null,
        sholatMonth: [],

        // Quran
        quranLoading: true,
        quranError: null,
        quranSurah: null,
        quranFiltered: [],
        quranSearch: '',
        activeSurah: null,
        quranAyat: [],
        quranAyatLoading: false,

        // Hadits
        haditsLoading: true,
        haditsBooks: [],
        filteredBooks: [],
        haditsSearch: '',
        activeBook: null,
        haditsItems: [],

        // Dzikir
        dzikirActive: 0,
        dzikirGroups: [],
        dzikirCounters: [],

        init() {
          this.$watch('darkMode', val => { localStorage.setItem('hakhagi-dark', val); if (window.lucide) setTimeout(() => lucide.createIcons(), 50) })
          this.$watch('fontSize', val => localStorage.setItem('hakhagi-font', val))
          this.$watch('theme', val => { localStorage.setItem('hakhagi-theme', val); if (window.lucide) setTimeout(() => lucide.createIcons(), 50) })
          this.$watch('activeTab', val => {
            localStorage.setItem('hakhagi-tab', val)
            this.loadTab(val)
            if (window.lucide) setTimeout(() => lucide.createIcons(), 100)
          })
          this.loadTab(this.activeTab)
          this.loadDzikir()
          this.loadHadits()
        },

        loadTab(tab) {
          if (tab === 'sholat' && !this.sholatToday) this.loadSholat()
          if (tab === 'quran' && !this.quranSurah) this.loadQuranList()
          if (tab === 'hadits' && !this.haditsBooks.length) this.loadHadits()
          if (tab === 'dzikir' && !this.dzikirGroups.length) this.loadDzikir()
          setTimeout(() => { if (window.lucide) lucide.createIcons() }, 200)
        },

        // ─── SHOLAT ───
        async loadSholat() {
          this.sholatLoading = true; this.sholatError = null
          try {
            const now = new Date()
            const y = now.getFullYear(), m = String(now.getMonth() + 1).padStart(2, '0')
            const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/1434/${y}/${m}`)
            const d = await res.json()
            if (!d.status) throw new Error('API error')
            this.sholatMonth = d.data.jadwal
            const today = `${y}-${m}-${String(now.getDate()).padStart(2, '0')}`
            this.sholatToday = this.sholatMonth.find(x => x.date === today) || this.sholatMonth[now.getDate() - 1] || this.sholatMonth[0]
          } catch (e) {
            this.sholatError = e.message
          } finally { this.sholatLoading = false }
        },

        // ─── QURAN ───
        async loadQuranList() {
          this.quranLoading = true; this.quranError = null
          try {
            const res = await fetch('https://equran.id/api/surat')
            this.quranSurah = await res.json()
            this.quranFiltered = [...this.quranSurah]
          } catch (e) {
            this.quranError = e.message
          } finally { this.quranLoading = false }
        },

        filterSurah() {
          const q = this.quranSearch.toLowerCase()
          if (!this.quranSurah) return
          this.quranFiltered = q ? this.quranSurah.filter(s =>
            s.nama_latin.toLowerCase().includes(q) || s.arti.toLowerCase().includes(q) || s.nomor.toString().includes(q)
          ) : [...this.quranSurah]
        },

        async openSurah(surah) {
          this.activeSurah = surah; this.quranAyat = []; this.quranAyatLoading = true
          try {
            const res = await fetch(`https://equran.id/api/surat/${surah.nomor}`)
            const d = await res.json()
            this.quranAyat = d.ayat || []
          } catch (e) {
            this.quranAyat = []
          } finally { this.quranAyatLoading = false }
        },

        // ─── HADITS ───
        async loadHadits() {
          this.haditsLoading = true
          try {
            const res = await fetch('/data/hadits_books.json')
            this.haditsBooks = await res.json()
            this.filteredBooks = [...this.haditsBooks]
          } catch (e) {
            this.haditsBooks = []; this.filteredBooks = []
          } finally { this.haditsLoading = false }
        },

        filterHadits() {
          const q = this.haditsSearch.toLowerCase()
          if (this.activeBook) {
            if (!q) { this.filteredHadits = [...this.haditsItems]; return }
            this.filteredHadits = this.haditsItems.filter(h =>
              h.teks_arab.includes(q) || h.terjemahan_id.toLowerCase().includes(q) || h.nomor.toString().includes(q)
            )
          } else {
            this.filteredBooks = q ? this.haditsBooks.filter(b =>
              b.perawi_nama.toLowerCase().includes(q)
            ) : [...this.haditsBooks]
          }
        },

        filteredHadits: [],

        async openBook(book) {
          this.activeBook = book; this.haditsItems = []; this.filteredHadits = []
          this.haditsLoading = true
          try {
            const res = await fetch(`/data/hadits_${book.perawi_slug}.json`)
            this.haditsItems = await res.json()
            this.filteredHadits = [...this.haditsItems]
          } catch (e) {
            this.haditsItems = []; this.filteredHadits = []
          } finally { this.haditsLoading = false }
        },

        // ─── DZIKIR ───
        async loadDzikir() {
          try {
            const res = await fetch('/data/dzikir.json')
            this.dzikirGroups = await res.json()
            this.resetDzikirCounters(0)
          } catch (e) {
            this.dzikirGroups = []
          }
        },

        resetDzikirCounters(idx) {
          if (!this.dzikirGroups[idx]) return
          this.dzikirCounters = this.dzikirGroups[idx].items.map(() => 0)
        },

        incrementDzikir(idx) {
          const max = this.dzikirGroups[this.dzikirActive]?.items[idx]?.count || 0
          if (this.dzikirCounters[idx] < max) this.dzikirCounters[idx]++
        },

        decrementDzikir(idx) {
          if (this.dzikirCounters[idx] > 0) this.dzikirCounters[idx]--
        }
      }
    }
  </script>
</body>
